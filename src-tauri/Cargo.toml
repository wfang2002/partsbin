[package]
name = "partsbin"
version = "0.1.0"
description = "PartsBin: home electronic parts organizer"
authors = ["Wei Fang"]
edition = "2021"

[lib]
name = "partsbin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Secrets (API keys, sign-in tokens) go to the operating system keychain.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
btleplug = "0.11"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros"] }
uuid = "1"
